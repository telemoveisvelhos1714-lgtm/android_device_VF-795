name: Build TWRP VF-795

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: fr3akyphantom/droid-builder:latest
      options: --user root
    steps:
      - name: Limpar espaco em disco
        run: |
          df -h

      - name: Configurar Repo e Git
        run: |
          export HOME=/root
          git config --global user.email "builder@vf795.local"
          git config --global user.name "VF795 Builder"

      - name: Sincronizar codigo-fonte TWRP 5.1
        run: |
          export HOME=/root
          mkdir -p /root/twrp
          cd /root/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copiar a tua Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp-device-tree

      - name: Mover Device Tree e Compilar recovery.img
        shell: bash
        run: |
          export HOME=/root
          mkdir -p /root/twrp/device/vodafone/VF_795
          cp -r twrp-device-tree/* /root/twrp/device/vodafone/VF_795/
          cd /root/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_VF_795-eng
          mka recoveryimage
          cp /root/twrp/out/target/product/VF_795/recovery.img $GITHUB_WORKSPACE/recovery.img

      - name: Guardar ficheiro recovery.img compilado
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-VF_795
          path: recovery.img
