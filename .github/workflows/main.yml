name: Build TWRP VF-795

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: fr3akyphantom/droid-builder:latest
    steps:
      - name: Limpar espaco em disco
        run: |
          df -h

      - name: Configurar Repo e Git
        run: |
          git config --global user.email "builder@vf795.local"
          git config --global user.name "VF795 Builder"

      - name: Sincronizar codigo-fonte TWRP 5.1
        run: |
          mkdir -p /root/twrp
          cd /root/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copiar a tua Device Tree
        uses: actions/checkout@v4
        with:
          path: /root/twrp/device/vodafone/VF-795

      - name: Compilar recovery.img
        run: |
          cd /root/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_VF-795-eng
          mka recoveryimage

      - name: Guardar ficheiro recovery.img compilado
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-VF-795
          path: /root/twrp/out/target/product/VF-795/recovery.img
